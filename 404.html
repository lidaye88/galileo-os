<!DOCTYPE html>

<head>

<title>页面不存在 | Galileo OS 工业智能开放平台</title>

<body style="background:var(--bg-dark);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;font-family:-apple-system,'PingFang SC',sans-serif;">

<main style="text-align:center;padding:40px 24px;">
  <!-- 404 大字 -->
  <div style="font-family:'SF Mono','JetBrains Mono',monospace;font-size:96px;font-weight:700;color:var(--accent-500);letter-spacing:-0.04em;line-height:1;margin-bottom:8px;">404</div>
  <div style="font-size:14px;color:var(--text-inverse-3);letter-spacing:0.2em;margin-bottom:32px;">PAGE NOT FOUND</div>

  <h1 style="color:var(--text-inverse);font-size:24px;font-weight:600;margin:0 0 12px;">这个页面走丢了</h1>
  <p style="color:var(--text-inverse-2);font-size:15px;max-width:420px;margin:0 auto 36px;line-height:1.7;">

  </p>

  <!-- 操作按钮 -->
  <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
    <a href="index.html" style="display:inline-flex;align-items:center;padding:12px 28px;background:linear-gradient(135deg,var(--accent-500),var(--accent-600));color:var(--ink-950);font-weight:600;font-size:14px;border-radius:8px;text-decoration:none;box-shadow:0 4px 14px -4px rgba(0,217,163,0.45);">返回首页</a>
    <a href="solutions.html" style="display:inline-flex;align-items:center;padding:12px 28px;background:rgba(255,255,255,0.06);color:var(--text-inverse);font-weight:500;font-size:14px;border-radius:8px;text-decoration:none;border:1px solid rgba(255,255,255,0.2);">浏览解决方案</a>
  </div>

  <!-- 常用入口 -->
  <div style="margin-top:48px;padding-top:32px;border-top:1px solid rgba(255,255,255,0.08);">
    <div style="font-size:12px;color:var(--text-inverse-3);letter-spacing:0.06em;margin-bottom:16px;">常用入口</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <a href="apps.html" style="padding:7px 16px;font-size:13px;color:var(--text-inverse-2);text-decoration:none;border:1px solid rgba(255,255,255,0.12);border-radius:99px;">应用市场</a>
      <a href="agents.html" style="padding:7px 16px;font-size:13px;color:var(--text-inverse-2);text-decoration:none;border:1px solid rgba(255,255,255,0.12);border-radius:99px;">Agent 市场</a>
      <a href="skills.html" style="padding:7px 16px;font-size:13px;color:var(--text-inverse-2);text-decoration:none;border:1px solid rgba(255,255,255,0.12);border-radius:99px;">Skill 市场</a>
      <a href="knowledge.html" style="padding:7px 16px;font-size:13px;color:var(--text-inverse-2);text-decoration:none;border:1px solid rgba(255,255,255,0.12);border-radius:99px;">知识库</a>
      <a href="platform.html" style="padding:7px 16px;font-size:13px;color:var(--text-inverse-2);text-decoration:none;border:1px solid rgba(255,255,255,0.12);border-radius:99px;">操作系统</a>
